version: '3.8'

services:
  polaris-search:
    build: .
    image: polaris-search:prod
    container_name: polaris-search
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MCP_ALLOWED_HOSTS=localhost:*,127.0.0.1:*,*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
